name: MacBleUnlock
options:
  bundleIdPrefix: com.karloyu.macbleunlock
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "13.0"
targets:
  MacBleUnlock:
    type: application
    platform: macOS
    sources:
      - path: Sources/MacBleUnlock
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_NAME: MacBleUnlock
        PRODUCT_BUNDLE_IDENTIFIER: com.karloyu.macbleunlock
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/MacBleUnlock/Resources/Info.plist
    scheme:
      testTargets:
        - MacBleUnlockTests
      gatherCoverageData: true

  # The logic worth testing here is the timing and classification code that has been retuned
  # repeatedly from recollection — backoff selection, error classification, RSSI smoothing, keyboard
  # layout mapping. None of it needs a radio, and until now none of it had a target to live in.
  MacBleUnlockTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/MacBleUnlockTests
    dependencies:
      - target: MacBleUnlock
    settings:
      base:
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        GENERATE_INFOPLIST_FILE: YES
        # Unsigned on CI, where no certificate exists.
        CODE_SIGN_STYLE: Automatic
